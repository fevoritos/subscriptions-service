services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subsservice}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subsservice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_create_subs.up.sql:/docker-entrypoint-initdb.d/0001_create_subs.sql:ro
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_DSN: ${DATABASE_DSN:-postgres://postgres:postgres@postgres:5432/subsservice?sslmode=disable}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: